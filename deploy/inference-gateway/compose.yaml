services:
  inference-gateway:
    build:
      context: ../../services/inference_gateway
    container_name: ${GATEWAY_CONTAINER_NAME:-ddu-gateway}
    restart: unless-stopped
    environment:
      GATEWAY_CLIENT_TOKEN: ${GATEWAY_CLIENT_TOKEN:?set GATEWAY_CLIENT_TOKEN}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?set GATEWAY_ADMIN_TOKEN}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?set BRIDGE_TOKEN}
      LUNA_BRIDGE_PORT: ${LUNA_BRIDGE_PORT:-18765}
      GATEWAY_STATE_PATH: /data/providers.json
      LUNA_ENABLED: ${LUNA_ENABLED:-false}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - gateway-state:/data
    networks:
      ddu_inference_bus:
        aliases:
          - ${GATEWAY_NETWORK_ALIAS:-ddu-gateway}
      gateway_admin_bus:
        aliases:
          - ${GATEWAY_NETWORK_ALIAS:-ddu-gateway}
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 512m
  admin-proxy:
    build:
      context: ../../services/inference_gateway
    container_name: ${GATEWAY_ADMIN_CONTAINER_NAME:-ddu-gateway-admin}
    command: ["uvicorn", "admin_proxy:app", "--host", "0.0.0.0", "--port", "8080", "--limit-concurrency", "16"]
    restart: unless-stopped
    environment:
      GATEWAY_UPSTREAM_URL: "${GATEWAY_UPSTREAM_URL:-http://ddu-gateway:8080}"
    depends_on:
      inference-gateway:
        condition: service_started
    ports:
      - "127.0.0.1:${GATEWAY_ADMIN_HOST_PORT:-18766}:8080"
    networks:
      - gateway_admin_bus
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
networks:
  ddu_inference_bus:
    external: true
  gateway_admin_bus: {}
volumes:
  gateway-state:
